<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘 닿은 물건</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:#A3A8B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #14161A; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 32px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="V2Mood.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6B7079"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #E0528A"></span>억울했어요</span>
  </div>
  <h1 style="margin: 20px 0 0; font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em">오늘 손에 닿은<br>물건은요?</h1>

  <label for="v2-item" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">물건 이름</label>
  <input id="v2-item" value="{{query}}" placeholder="아무 물건이나" style="margin-top: 28px; height: 56px; border: 0; border-bottom: 2px solid #14161A; background: transparent; outline: none; font-family: inherit; font-size: 22px; font-weight: 500; color: #14161A; padding: 0">

  <span style="margin-top: 28px; font-size: 13px; color: #6B7079">자주 고르는 것</span>
  <ul style="list-style: none; margin: 4px 0 0; padding: 0">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <li style="border-bottom: 1px solid #E8EAEE">
        <button onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" style="{{it.style}}">
          <span>{{it.label}}</span>
          <span aria-hidden="true" style="{{it.markStyle}}"></span>
        </button>
      </li>
    </sc-for>
  </ul>

  <a href="V2Thread.dc.html" style="margin-top: auto; height: 56px; border-radius: 16px; background: #14161A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">실 따라가기</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ITEMS = ['아이스 아메리카노', '스마트폰', '삼각김밥', '라면', '택배로 온 물건', '면 티셔츠'];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { item: 0 }; }
  renderVals() {
    var self = this, cur = this.state.item;
    return {
      query: ITEMS[cur],
      items: ITEMS.map(function (label, i) {
        var on = i === cur;
        return {
          label: label,
          pressed: on ? 'true' : 'false',
          pick: function () { self.setState({ item: i }); },
          style: 'width: 100%; height: 56px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 17px; text-align: left; ' + (on ? 'color: #14161A; font-weight: 700' : 'color: #3F434A; font-weight: 400'),
          markStyle: 'width: 8px; height: 8px; border-radius: 4px; background: ' + (on ? '#E0528A' : 'transparent')
        };
      })
    };
  }
}
</script>
</body>
</html>
