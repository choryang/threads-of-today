<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그 사람의 오늘</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #14161A; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 32px">
  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #6B7079">
    <span>에티오피아 시다마</span>
    <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="{{orbStyle}}"></span>지금 {{localTime}}</span>
  </div>

  <div style="margin-top: 12px; position: relative; width: 342px; height: 228px; border-radius: 20px; overflow: hidden">
    <img src="/_blob/1158966586f0ff770daf3a7b9f9e1da2" alt="비탈진 언덕에 커피 나무가 줄지어 선 시다마의 커피 밭" style="width: 342px; height: 228px; object-fit: cover; object-position: center 60%; display: block">
    <div aria-hidden="true" style="{{tintStyle}}"></div>
  </div>

  <span style="margin-top: 24px; font-size: 13px; font-weight: 500; color: #E0528A">오늘 당신의 커피를 딴 사람</span>
  <h1 style="margin: 6px 0 0; font-size: 24px; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em">알마즈도 오늘,<br>억울한 하루였어요.</h1>
  <p style="margin: 16px 0 0; font-size: 16px; line-height: 1.8; color: #2A2D33">일손이 모자라자 덜 익은 열매도 같이 따서 넘기자는 말이 나왔어요. 알마즈는 끝까지 잘 익은 것만 골랐고, 저울 앞에서 누군가 웃었어요.</p>
  <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.8; color: #2A2D33">그날 저녁, 이웃집 마당에서 알마즈의 잔이 제일 먼저 채워졌어요.</p>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid #E8EAEE">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">알마즈</span>
      <span style="font-size: 13px; color: #6B7079">커피 체리 수확자</span>
    </div>
    <span style="max-width: 170px; text-align: right; font-size: 13px; line-height: 1.5; color: #6B7079">{{doing}}</span>
  </div>
  <a href="V2Reply.dc.html" style="margin-top: 8px; height: 56px; border-radius: 16px; background: #14161A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">한마디 건네기</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"timeOfDay":{"editor":"enum","options":["지금","새벽","낮","노을","밤"],"default":"지금"},"$preview":{"width":390,"height":844}}'>
function clock(tz) {
  var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: false }).formatToParts(new Date());
  var h = 0, m = 0;
  parts.forEach(function (p) { if (p.type === 'hour') h = Number(p.value) % 24; if (p.type === 'minute') m = Number(p.value); });
  return { h: h, m: m };
}
function label(c) {
  var hh = c.h % 12 === 0 ? 12 : c.h % 12;
  return (c.h < 12 ? '오전 ' : '오후 ') + hh + ':' + (c.m < 10 ? '0' : '') + c.m;
}
class Component extends DCLogic {
  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 30000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    var c = clock('Africa/Addis_Ababa');
    var pick = { '새벽': 6, '낮': 12, '노을': 18, '밤': 23 }[this.props.timeOfDay];
    if (pick !== undefined) c = { h: pick, m: 10 };
    var h = c.h, day = h >= 6 && h < 18;
    var tint = h < 5 || h >= 20 ? 'background: #1B2440; mix-blend-mode: multiply; opacity: .7' : h < 7 ? 'background: #6B5B95; mix-blend-mode: multiply; opacity: .4' : h < 17 ? 'opacity: 0' : h < 19 ? 'background: #F2A97B; mix-blend-mode: multiply; opacity: .45' : 'background: #3E4A7A; mix-blend-mode: multiply; opacity: .5';
    var doing = h >= 7 && h < 18 ? '밭에서 열매를 따고 있을 거예요' : h >= 18 && h < 22 ? '집에서 저녁을 먹고 있을 거예요' : '자고 있을 거예요';
    return {
      localTime: label(c),
      orbStyle: 'width: 8px; height: 8px; border-radius: 4px; background: ' + (day ? '#F2B33D' : '#5F6B8C'),
      tintStyle: 'position: absolute; inset: 0; pointer-events: none; ' + tint,
      doing: '지금은 아마 ' + doing
    };
  }
}
</script>
</body>
</html>
