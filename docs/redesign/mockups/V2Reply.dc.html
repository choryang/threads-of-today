<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한마디</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #14161A; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 64px 24px 32px">
  <img src="/_blob/1158966586f0ff770daf3a7b9f9e1da2" alt="" style="width: 56px; height: 56px; border-radius: 28px; object-fit: cover; object-position: 55% 60%">
  <h1 style="margin: 16px 0 0; font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em">알마즈에게<br>한마디 건넬까요?</h1>

  <ul role="radiogroup" aria-label="건넬 말" style="list-style: none; margin: 24px 0 0; padding: 0">
    <sc-for list="{{replies}}" as="r" hint-placeholder-count="4">
      <li style="border-bottom: 1px solid #E8EAEE">
        <button role="radio" aria-checked="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}">
          <span>{{r.label}}</span>
          <span aria-hidden="true" style="{{r.ring}}"><span style="{{r.fill}}"></span></span>
        </button>
      </li>
    </sc-for>
  </ul>

  <div style="{{knotWrap}}">
    <svg aria-hidden="true" width="342" height="56" viewBox="0 0 342 56">
      <path d="M0 28 C 80 28, 120 28, 158 28 C 168 28, 176 14, 171 10 C 164 6, 156 22, 171 30 C 186 38, 180 50, 171 46 C 164 42, 172 28, 184 28 C 230 28, 280 28, 342 28" fill="none" stroke="#E0528A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="560" style="{{knotDash}}"></path>
    </svg>
    <span style="margin-top: 12px; font-size: 17px; font-weight: 700">실을 묶었어요</span>
    <span style="margin-top: 6px; font-size: 15px; line-height: 1.6; color: #6B7079">다음에 다시 만나면, 알마즈가 오늘 당신이 한 말을 기억하고 있을 거예요.</span>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="V2Quote.dc.html" style="height: 56px; border-radius: 16px; background: #F1F2F5; color: #14161A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">카드로 남기기</a>
    <a href="V2Map.dc.html" style="height: 56px; border-radius: 16px; background: #14161A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">이어진 사람들</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var REPLIES = ['저도 오늘 그랬어요', '고생 많았어요', '내일은 나을 거예요', '직접 쓸게요'];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 0, k: 0 }; }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () { if (self.state.k < 1) self.setState({ k: Math.min(1, self.state.k + 0.04) }); }, 30);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var self = this, cur = this.state.pick, k = this.state.k;
    return {
      replies: REPLIES.map(function (label, i) {
        var on = i === cur;
        return {
          label: label,
          pressed: on ? 'true' : 'false',
          pick: function () { self.setState({ pick: i, k: 0 }); },
          style: 'width: 100%; height: 60px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 17px; text-align: left; color: #14161A; ' + (on ? 'font-weight: 700' : 'font-weight: 400'),
          ring: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid ' + (on ? '#E0528A' : '#CDD1D8') + '; display: flex; align-items: center; justify-content: center',
          fill: 'width: 10px; height: 10px; border-radius: 5px; background: ' + (on ? '#E0528A' : 'transparent')
        };
      }),
      knotWrap: 'margin-top: 28px; display: flex; flex-direction: column; opacity: ' + (cur === null ? 0 : 1) + '; transition: opacity .3s',
      knotDash: 'stroke-dashoffset: ' + (560 * (1 - k)).toFixed(0)
    };
  }
}
</script>
</body>
</html>
